# Detekt 1.23.x runs its analysis in-process on the daemon JVM and cannot parse
# a `java.version` of 25.0.x (detekt/detekt#9771, #9772, #8714).
# The daemon therefore runs on Java 21, whatever JDK the CI runner or local shell provides.
# The JBR 25 toolchain is unaffected: compilation and `run` still use it.
toolchainVersion=21
